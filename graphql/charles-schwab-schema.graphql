}

"""An options contract granting the right to buy or sell an underlying at a set price."""
type Option implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  type: OptionType
  putCall: PutCall
  underlyingSymbol: String
