  defaultEquityOrderType: OrderType
  defaultEquityOrderDuration: OrderDuration
  defaultEquityOrderMarketSession: OrderSession
  mutualFundTaxLotMethod: String
  optionTaxLotMethod: String
  equityTaxLotMethod: String
}

input ScreenerFilter {
  field: String!
  operator: String!
  value: String!
}

# ─── Root Types ───────────────────────────────────────────────────────────────

type Query {
  """Fetch a single linked account by ID."""
  account(accountId: ID!): Account

  """List all accounts linked to the authenticated user."""
  accounts: [Account!]!

  """Fetch a single order within an account."""
  order(accountId: ID!, orderId: ID!): OrderRecord

  """List orders within an account with optional filters."""
  orders(accountId: ID!, filter: OrderFilter): [OrderRecord!]!

  """Fetch a single transaction by ID."""
  transaction(accountId: ID!, transactionId: ID!): Transaction

  """List transactions within an account with optional filters."""
  transactions(accountId: ID!, filter: TransactionFilter): [Transaction!]!

  """Fetch a real-time or delayed quote for a single symbol."""
  quote(symbol: String!, fields: [String]): Quote

  """Fetch quotes for multiple symbols in a single request."""
  quotes(symbols: [String!]!, fields: [String]): [Quote!]!

  """Retrieve the full option chain for an underlying symbol."""
  optionChain(symbol: String!, filter: OptionChainFilter): OptionChain

  """Retrieve OHLCV price history for a symbol."""
  priceHistory(symbol: String!, filter: PriceHistoryFilter): HistoricalData

  """Retrieve market hours for one or more markets on a given date."""
  marketHours(markets: [Market!]!, date: String): [MarketHour!]!

  """Retrieve top movers for a major index."""
  movers(index: String!, direction: Direction, change: ChangeType): [MoversData!]!

  """Retrieve an instrument by CUSIP."""
  instrument(cusip: String!): Instrument

  """Search for instruments by symbol or description."""
  searchInstruments(symbol: String!, projection: Projection): [Instrument!]!

  """List all watchlists for an account."""
  watchlists(accountId: ID!): [WatchList!]!

  """Fetch a single watchlist."""
  watchlist(accountId: ID!, watchlistId: ID!): WatchList

  """Retrieve authenticated user principal data and streaming credentials."""
  userPrincipals: UserPrincipals

  """Retrieve news headlines, optionally filtered by symbols."""
  news(symbols: [String!], count: Int): [News!]!

  """Run an equity screener with one or more filter criteria."""
  screener(filters: [ScreenerFilter!]!): Screener

  """Retrieve analyst ratings for a symbol."""
  analystRatings(symbol: String!): [AnalystRating!]!

  """Retrieve consensus earnings estimates for a symbol."""
  earningEstimates(symbol: String!): [EarningEstimate!]!

  """Retrieve customer profile for the authenticated user."""
  customer: Customer
}

type Mutation {
  """Place a new order within an account."""
  placeOrder(accountId: ID!, input: OrderInput!): OrderRecord

  """Cancel an existing working order."""
  cancelOrder(accountId: ID!, orderId: ID!): Boolean

  """Replace an existing order with a new order specification."""
  replaceOrder(accountId: ID!, orderId: ID!, input: OrderInput!): OrderRecord

  """Create a new watchlist for an account."""
  createWatchlist(accountId: ID!, input: WatchListInput!): WatchList

  """Update an existing watchlist."""
  updateWatchlist(accountId: ID!, watchlistId: ID!, input: WatchListInput!): WatchList

  """Delete a watchlist."""
  deleteWatchlist(accountId: ID!, watchlistId: ID!): Boolean

  """Update trading and display preferences for an account."""
  updatePreferences(accountId: ID!, input: PreferenceInput!): Preference
}

schema {
  query: Query
  mutation: Mutation
}
