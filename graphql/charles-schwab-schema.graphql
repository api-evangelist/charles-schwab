# ─── Orders ───────────────────────────────────────────────────────────────────

"""A persisted order record as returned by the Trader API."""
type OrderRecord {
  orderId: ID!
  accountId: ID!
  session: OrderSession
  duration: OrderDuration
  orderType: OrderType!
  cancelTime: DateTime
  complexOrderStrategyType: String
  quantity: Decimal
  filledQuantity: Decimal
  remainingQuantity: Decimal
  requestedDestination: String
  destinationLinkName: String
  releaseTime: DateTime
  stopPrice: Decimal
  stopPriceLinkBasis: String
  stopPriceLinkType: String
  stopPriceOffset: Decimal
  stopType: String
  priceLinkBasis: String
  priceLinkType: String
  price: Decimal
  taxLotMethod: String
  orderLegCollection: [OrderLeg!]!
  activationPrice: Decimal
  specialInstruction: String
  orderStrategyType: String
  status: OrderStatus!
  enteredTime: DateTime
  closeTime: DateTime
  accountNumber: String
  orderActivityCollection: [JSON]
  replacingOrderCollection: [JSON]
  childOrderStrategies: [JSON]
  statusDescription: String
}

"""A single leg within a multi-leg or single-leg order."""
type OrderLeg {
  orderLegType: AssetType
  legId: Int
  instrument: Instrument!
  instruction: OrderInstruction!
  positionEffect: String
  quantity: Decimal!
  quantityType: String
  divCapGains: String
  toSymbol: String
}

"""A market order executed at the prevailing best available price."""
type MarketOrder {
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  instruction: OrderInstruction!
  session: OrderSession!
  duration: OrderDuration!
  status: OrderStatus
  filledQuantity: Decimal
  averageFillPrice: Decimal
  enteredTime: DateTime
  closeTime: DateTime
}

"""A limit order specifying a maximum buy or minimum sell price."""
type LimitOrder {
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  limitPrice: Decimal!
  instruction: OrderInstruction!
  session: OrderSession!
  duration: OrderDuration!
  status: OrderStatus
  filledQuantity: Decimal
  averageFillPrice: Decimal
  enteredTime: DateTime
  closeTime: DateTime
}

"""A stop order that becomes a market order when the stop price is triggered."""
type StopOrder {
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  stopPrice: Decimal!
  instruction: OrderInstruction!
  session: OrderSession!
  duration: OrderDuration!
  status: OrderStatus
  filledQuantity: Decimal
  enteredTime: DateTime
  closeTime: DateTime
}

"""A stop-limit order triggered at the stop price and filled at the limit price or better."""
type StopLimitOrder {
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  stopPrice: Decimal!
  limitPrice: Decimal!
  instruction: OrderInstruction!
  session: OrderSession!
  duration: OrderDuration!
  status: OrderStatus
  filledQuantity: Decimal
  enteredTime: DateTime
  closeTime: DateTime
}

"""A trailing stop order whose stop price adjusts with the market."""
type TrailingStop {
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  stopPriceLinkType: String!
  stopPriceOffset: Decimal!
  instruction: OrderInstruction!
  session: OrderSession!
  duration: OrderDuration!
  status: OrderStatus
  filledQuantity: Decimal
  enteredTime: DateTime
  closeTime: DateTime
}

"""An OCO (one-cancels-other) order pairing two child orders."""
type OCOOrder {
  orderId: ID!
  accountId: ID!
  childOrderStrategies: [OrderRecord!]!
  status: OrderStatus
  enteredTime: DateTime
  closeTime: DateTime
}

"""An executed trade record associated with a filled order."""
type Trade {
  tradeId: ID!
  orderId: ID!
  accountId: ID!
  symbol: String!
  quantity: Decimal!
  price: Decimal!
  instruction: OrderInstruction!
  assetType: AssetType!
  executionTime: DateTime!
  settlementDate: DateTime
  commission: Decimal
  fees: Decimal
  netAmount: Decimal
}

# ─── Transactions ─────────────────────────────────────────────────────────────

"""A historical account transaction (trade, dividend, transfer, etc.)."""
type Transaction {
  transactionId: ID!
