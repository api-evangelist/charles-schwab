input OrderInput {
  orderType: OrderType!
  session: OrderSession!
  duration: OrderDuration!
  orderStrategyType: String!
  price: Decimal
  stopPrice: Decimal
  stopPriceLinkType: String
  stopPriceOffset: Decimal
  complexOrderStrategyType: String
  quantity: Decimal
  orderLegCollection: [OrderLegInput!]!
  childOrderStrategies: [OrderInput]
}

input OrderLegInput {
  orderLegType: AssetType
  instrument: InstrumentInput!
  instruction: OrderInstruction!
  positionEffect: String
  quantity: Decimal!
}

input InstrumentInput {
  symbol: String!
  assetType: AssetType!
  cusip: String
}

input OrderFilter {
  fromEnteredTime: DateTime
  toEnteredTime: DateTime
  status: OrderStatus
  maxResults: Int
}

input TransactionFilter {
  startDate: DateTime
  endDate: DateTime
  types: [TransactionType]
  symbol: String
}

input OptionChainFilter {
  contractType: PutCall
  strikeCount: Int
  includeQuotes: Boolean
  strategy: String
  interval: Decimal
  strike: Decimal
  range: String
  fromDate: String
  toDate: String
  volatility: Decimal
  underlyingPrice: Decimal
  interestRate: Decimal
  daysToExpiration: Int
  expMonth: String
  optionType: OptionType
}

input PriceHistoryFilter {
