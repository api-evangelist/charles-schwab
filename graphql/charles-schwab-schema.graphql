"""
Charles Schwab GraphQL Schema
Conceptual schema derived from the Schwab Trader API v2 and Market Data API.
Developer Portal: https://developer.schwab.com/
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar Decimal
scalar JSON

# ─── Enums ────────────────────────────────────────────────────────────────────

enum AccountType {
  BROKERAGE
  IRA
  ROTH_IRA
  ACCOUNT_401K
  MARGIN
  CASH
}

enum OrderStatus {
  AWAITING_PARENT_ORDER
  AWAITING_CONDITION
  AWAITING_STOP_CONDITION
  AWAITING_MANUAL_REVIEW
  ACCEPTED
  AWAITING_UR_OUT
  PENDING_ACTIVATION
  QUEUED
  WORKING
  REJECTED
  PENDING_CANCEL
  CANCELED
  PENDING_REPLACE
  REPLACED
  FILLED
  EXPIRED
  NEW
  AWAITING_RELEASE_TIME
  PENDING_ACKNOWLEDGEMENT
  PENDING_RECALL
  UNKNOWN
}

enum OrderType {
  MARKET
  LIMIT
  STOP
  STOP_LIMIT
  TRAILING_STOP
  CABINET
  NON_MARKETABLE
  MARKET_ON_CLOSE
  EXERCISE
