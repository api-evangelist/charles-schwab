# ─── Research & News ──────────────────────────────────────────────────────────

"""A news headline and summary for one or more symbols."""
type News {
  newsId: ID!
  headline: String!
  story: String
  source: String
  publishedAt: DateTime!
  symbols: [String!]
  url: String
  imageUrl: String
}

"""Research report from a broker or third-party provider."""
type Research {
  reportId: ID!
  title: String!
  author: String
  provider: String
  publishedAt: DateTime!
  summary: String
  symbols: [String!]
  url: String
  rating: AnalystRating
}

"""Analyst price target and buy/sell/hold rating for an equity."""
type AnalystRating {
  symbol: String!
  provider: String!
  rating: String!
  priceTarget: Decimal
  priceTargetHigh: Decimal
  priceTargetLow: Decimal
  ratingDate: DateTime
  analystName: String
  firmName: String
}

"""Consensus earnings estimate for an upcoming reporting period."""
type EarningEstimate {
  symbol: String!
  fiscalPeriod: String!
  reportDate: DateTime
  estimatedEPS: Decimal
  actualEPS: Decimal
  surprise: Decimal
  surprisePercent: Decimal
  consensusEPS: Decimal
  numberOfEstimates: Int
}

# ─── Watchlists ───────────────────────────────────────────────────────────────

"""A named list of symbols maintained by the user."""
type WatchList {
  watchlistId: ID!
  accountId: ID!
  name: String!
  watchlistItems: [WatchListInstrument!]!
}

"""A single instrument entry within a watchlist."""
type WatchListInstrument {
  sequenceId: Int
  quantity: Decimal
  averagePrice: Decimal
  commission: Decimal
  purchasedDate: DateTime
  instrument: Instrument!
}

# ─── Screener ─────────────────────────────────────────────────────────────────

"""A saved equity screener configuration."""
type Screener {
  screenerId: ID!
  name: String
  filters: [Filter!]!
  results: [Quote]
  resultCount: Int
  createdAt: DateTime
  updatedAt: DateTime
}

"""A single screening criterion (field + operator + value)."""
type Filter {
  field: String!
  operator: String!
  value: String!
}

