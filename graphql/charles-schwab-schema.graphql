# ─── Instruments ──────────────────────────────────────────────────────────────

"""Base interface for all tradeable instruments."""
interface Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
}

"""A publicly traded equity (common or preferred stock)."""
type Stock implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  exchange: String
  exchangeName: String
  type: String
  fundamental: Fundamental
}

"""An exchange-traded equity instrument (alias for core equity object)."""
type Equity implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  exchange: String
  exchangeName: String
}

"""A fixed income debt instrument."""
type Bond implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  bondFactor: String
  bondMultiplier: Decimal
  bondPrice: Decimal
  maturityDate: DateTime
  couponRate: Decimal
  callDate: DateTime
}

"""An exchange-traded fund."""
type ETF implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  exchange: String
  exchangeName: String
  fundamental: Fundamental
}

"""A market index (not directly tradeable)."""
type Index implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  exchange: String
  exchangeName: String
}

"""A pooled investment vehicle priced once daily at NAV."""
type MutualFund implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  type: String
  exchangeName: String
