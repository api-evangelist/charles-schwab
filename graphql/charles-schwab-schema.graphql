enum AssetType {
  EQUITY
  MUTUAL_FUND
  OPTION
  FUTURE
  FOREX
  INDEX
  CASH_EQUIVALENT
  FIXED_INCOME
  PRODUCT
  CURRENCY
  COLLECTIVE_INVESTMENT
}

enum PutCall {
  PUT
  CALL
  UNKNOWN
}

enum OptionType {
  VANILLA
  BINARY
  BARRIER
  UNKNOWN
}

enum Market {
  EQUITY
  OPTION
  FUTURE
  BOND
  FOREX
}

enum Direction {
  UP
  DOWN
}

enum ChangeType {
  VALUE
  PERCENT
}

enum Projection {
  SYMBOL_SEARCH
  SYMBOL_REGEX
  DESC_SEARCH
  DESC_REGEX
  SEARCH
  FUNDAMENTAL
}

enum TransactionType {
  TRADE
  RECEIVE_AND_DELIVER
  DIVIDEND_OR_INTEREST
  ACH_RECEIPT
  ACH_DISBURSEMENT
  CASH_RECEIPT
  CASH_DISBURSEMENT
  ELECTRONIC_FUND
  WIRE_OUT
  WIRE_IN
  JOURNAL
  MEMORANDUM
  MARGIN_CALL
  MONEY_MARKET
  SMA_ADJUSTMENT
}

enum FrequencyType {
  MINUTE
  DAILY
  WEEKLY
  MONTHLY
}

enum PeriodType {
  DAY
  MONTH
  YEAR
  YTD
}

# ─── Authentication & User Types ──────────────────────────────────────────────

"""OAuth 2.0 authentication context for the Schwab API."""
type Authentication {
  clientId: String!
  scope: [String!]!
  accessToken: AccessToken!
  refreshToken: RefreshToken!
  tokenType: String!
}

"""Short-lived OAuth 2.0 access token (30-minute TTL)."""
type AccessToken {
  token: String!
  expiresIn: Int!
  issuedAt: DateTime!
  expiresAt: DateTime!
  tokenType: String!
}

"""Long-lived OAuth 2.0 refresh token (7-day TTL)."""
type RefreshToken {
  token: String!
  expiresIn: Int!
  issuedAt: DateTime!
  expiresAt: DateTime!
}

"""Top-level user identity and linked account summary."""
type UserPrincipals {
  userId: ID!
  userCdDomainId: String
  primaryAccountId: String
  lastLoginTime: DateTime
  tokenExpirationTime: DateTime
  loginTime: DateTime
  accessLevel: String
  stalePassword: Boolean
  accounts: [UserAccount!]!
  streamingInfo: StreamingToken
  preferences: Preference
  subscriptions: [UserSubscription!]!
}

"""Account association record on the authenticated user principal."""
type UserAccount {
  accountId: ID!
  description: String
  displayName: String
  accountCdDomainId: String
  company: String
  segment: String
  surrogateIds: JSON
  preferences: Preference
  acl: String
  authorizations: JSON
}

"""User notification and feature subscription."""
type UserSubscription {
  subscriptionId: ID!
  userId: ID!
  type: String!
  status: String!
  createdAt: DateTime!
  updatedAt: DateTime
}

"""Account-level display and trading preferences."""
type Preference {
  expressTrading: Boolean
  directOptionsRouting: Boolean
  directEquityRouting: Boolean
  defaultEquityOrderLegInstruction: String
  defaultEquityOrderType: OrderType
  defaultEquityOrderPriceLinkType: String
  defaultEquityOrderPriceLinkBasis: String
  defaultEquityOrderDuration: OrderDuration
  defaultEquityOrderMarketSession: OrderSession
  mutualFundTaxLotMethod: String
  optionTaxLotMethod: String
  equityTaxLotMethod: String
  defaultAdvancedToolLaunch: String
  authTokenTimeout: String
}

"""Credentials and endpoint info for the Schwab Streaming Service."""
type StreamingToken {
  userId: String!
  userCdDomainId: String
  primaryAccountId: String
  tokenTimestamp: DateTime
  tokenExpirationTime: DateTime
  appId: String
  acl: String
  quotes: JSON
  streamerInfo: JSON
}

# ─── Customer ─────────────────────────────────────────────────────────────────

"""Customer record associated with a Schwab account."""
type Customer {
  customerId: ID!
  firstName: String
  lastName: String
  email: String
  phone: String
  address: JSON
  accounts: [Account!]!
  createdAt: DateTime
  updatedAt: DateTime
}

# ─── Account Types ────────────────────────────────────────────────────────────

"""Base interface shared by all account variants."""
interface Account {
  accountId: ID!
  accountNumber: String!
  type: AccountType!
  description: String
  roundTrips: Int
  isDayTrader: Boolean
  isClosingOnlyRestricted: Boolean
  pfcbFlag: Boolean
  positions: [Position!]!
  balance: AccountBalance!
  initialBalances: AccountBalance
  currentBalances: AccountBalance
  projectedBalances: AccountBalance
  purchasingPower: PurchasingPower
}

"""Standard taxable brokerage account."""
type BrokerageAccount implements Account {
  accountId: ID!
  accountNumber: String!
  type: AccountType!
  description: String
  roundTrips: Int
  isDayTrader: Boolean
  isClosingOnlyRestricted: Boolean
  pfcbFlag: Boolean
  positions: [Position!]!
  balance: AccountBalance!
  initialBalances: AccountBalance
  currentBalances: AccountBalance
  projectedBalances: AccountBalance
  purchasingPower: PurchasingPower
  marginEnabled: Boolean
}

"""Traditional individual retirement account."""
type IRAAccount implements Account {
  accountId: ID!
  accountNumber: String!
  type: AccountType!
  description: String
  roundTrips: Int
  isDayTrader: Boolean
  isClosingOnlyRestricted: Boolean
  pfcbFlag: Boolean
  positions: [Position!]!
  balance: AccountBalance!
  initialBalances: AccountBalance
  currentBalances: AccountBalance
  projectedBalances: AccountBalance
  purchasingPower: PurchasingPower
