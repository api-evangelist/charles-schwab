}

"""A futures contract obligating delivery of an asset at a set date and price."""
type Future implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  activeContract: Boolean
  expirationDate: DateTime
  firstNoticeDate: DateTime
  lastTradingDate: DateTime
  multiplier: Decimal
  pricingMultiplier: Decimal
  settlementMethod: String
}

"""A digital asset / cryptocurrency."""
type Crypto implements Instrument {
  assetType: AssetType!
  cusip: String
  symbol: String!
  description: String
  netChange: Decimal
  exchange: String
}

"""Lightweight symbol reference used in watchlists and search results."""
type Symbol {
  symbol: String!
  description: String
  assetType: AssetType
  exchange: String
  cusip: String
}

