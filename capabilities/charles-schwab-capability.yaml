naftiko: 1.0.0-alpha2
info:
  label: Charles Schwab Market Data API
  description: REST API for retrieving real-time and historical market data from Charles Schwab including quotes, option chains,
    price history, market hours, instrument metadata, and movers for major US indices.
  tags:
  - Charles
  - Schwab
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: charles-schwab
    baseUri: https://api.schwabapi.com/marketdata/v1
    description: Charles Schwab Market Data API HTTP API.
    authentication:
      type: bearer
      token: '{{CHARLES_SCHWAB_TOKEN}}'
    resources:
    - name: quotes
      path: /quotes
      operations:
      - name: getquotes
        method: GET
        description: Get quotes for one or more symbols
        inputParameters:
        - name: symbols
          in: query
          type: string
          required: true
          description: Comma-separated list of ticker symbols.
        - name: fields
          in: query
          type: string
        - name: indicative
          in: query
          type: boolean
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: symbol-id-quotes
      path: /{symbol_id}/quotes
      operations:
      - name: getquote
        method: GET
        description: Get quote for a specific symbol
        inputParameters:
        - name: symbol_id
          in: path
          type: string
          required: true
        - name: fields
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: chains
      path: /chains
      operations:
      - name: getoptionchains
        method: GET
        description: Get option chain for a symbol
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
        - name: contractType
          in: query
          type: string
        - name: strikeCount
          in: query
          type: integer
        - name: includeQuotes
          in: query
          type: boolean
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: expirationchain
      path: /expirationchain
      operations:
      - name: getoptionexpirationchain
        method: GET
        description: Get option expiration chain for a symbol
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pricehistory
      path: /pricehistory
      operations:
      - name: getpricehistory
        method: GET
        description: Get price history candles for a symbol
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
        - name: periodType
          in: query
          type: string
        - name: period
          in: query
          type: integer
        - name: frequencyType
          in: query
          type: string
        - name: frequency
          in: query
          type: integer
        - name: startDate
          in: query
          type: integer
        - name: endDate
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: movers-symbol-id
      path: /movers/{symbol_id}
      operations:
      - name: getmovers
        method: GET
        description: Get top movers for an index
        inputParameters:
        - name: symbol_id
          in: path
          type: string
          required: true
          description: Index symbol such as $DJI, $COMPX, or $SPX.
        - name: sort
          in: query
          type: string
        - name: frequency
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: markets
      path: /markets
      operations:
      - name: getmarkethours
        method: GET
        description: Get market hours for one or more markets
        inputParameters:
        - name: markets
          in: query
          type: string
          required: true
        - name: date
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: markets-market-id
      path: /markets/{market_id}
      operations:
      - name: getmarkethoursformarket
        method: GET
        description: Get market hours for a single market
        inputParameters:
        - name: market_id
          in: path
          type: string
          required: true
        - name: date
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instruments
      path: /instruments
      operations:
      - name: searchinstruments
        method: GET
        description: Search instruments by symbol or CUSIP
        inputParameters:
        - name: symbol
          in: query
          type: string
          required: true
        - name: projection
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: charles-schwab-rest
    description: REST adapter for Charles Schwab Market Data API.
    resources:
    - path: /quotes
      name: getquotes
      operations:
      - method: GET
        name: getquotes
        description: Get quotes for one or more symbols
        call: charles-schwab.getquotes
        outputParameters:
        - type: object
          mapping: $.
    - path: /{symbol_id}/quotes
      name: getquote
      operations:
      - method: GET
        name: getquote
        description: Get quote for a specific symbol
        call: charles-schwab.getquote
        with:
          symbol_id: rest.symbol_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /chains
      name: getoptionchains
      operations:
      - method: GET
        name: getoptionchains
        description: Get option chain for a symbol
        call: charles-schwab.getoptionchains
        outputParameters:
        - type: object
          mapping: $.
    - path: /expirationchain
      name: getoptionexpirationchain
      operations:
      - method: GET
        name: getoptionexpirationchain
        description: Get option expiration chain for a symbol
        call: charles-schwab.getoptionexpirationchain
        outputParameters:
        - type: object
          mapping: $.
    - path: /pricehistory
      name: getpricehistory
      operations:
      - method: GET
        name: getpricehistory
        description: Get price history candles for a symbol
        call: charles-schwab.getpricehistory
        outputParameters:
        - type: object
          mapping: $.
    - path: /movers/{symbol_id}
      name: getmovers
      operations:
      - method: GET
        name: getmovers
        description: Get top movers for an index
        call: charles-schwab.getmovers
        with:
          symbol_id: rest.symbol_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /markets
      name: getmarkethours
      operations:
      - method: GET
        name: getmarkethours
        description: Get market hours for one or more markets
        call: charles-schwab.getmarkethours
        outputParameters:
        - type: object
          mapping: $.
    - path: /markets/{market_id}
      name: getmarkethoursformarket
      operations:
      - method: GET
        name: getmarkethoursformarket
        description: Get market hours for a single market
        call: charles-schwab.getmarkethoursformarket
        with:
          market_id: rest.market_id
        outputParameters:
        - type: object
          mapping: $.
    - path: /instruments
      name: searchinstruments
      operations:
      - method: GET
        name: searchinstruments
        description: Search instruments by symbol or CUSIP
        call: charles-schwab.searchinstruments
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: charles-schwab-mcp
    transport: http
    description: MCP adapter for Charles Schwab Market Data API for AI agent use.
