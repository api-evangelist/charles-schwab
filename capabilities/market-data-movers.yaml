naftiko: 1.0.0-alpha2
info:
  label: Charles Schwab Market Data API — Movers
  description: 'Charles Schwab Market Data API — Movers. 1 operations. Lead operation: Get top movers for an index. Self-contained
    Naftiko capability covering one Charles Schwab business surface.'
  tags:
  - Charles Schwab
  - Movers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHARLES_SCHWAB_API_KEY: CHARLES_SCHWAB_API_KEY
capability:
  consumes:
  - type: http
    namespace: market-data-movers
    baseUri: https://api.schwabapi.com/marketdata/v1
    description: Charles Schwab Market Data API — Movers business capability. Self-contained, no shared references.
    resources:
    - name: movers-symbol_id
      path: /movers/{symbol_id}
      operations:
      - name: getmovers
        method: GET
        description: Get top movers for an index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: symbol_id
          in: path
          type: string
          description: Index symbol such as $DJI, $COMPX, or $SPX.
          required: true
        - name: sort
          in: query
          type: string
        - name: frequency
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.CHARLES_SCHWAB_API_KEY}}'
  exposes:
  - type: rest
    namespace: market-data-movers-rest
    port: 8080
    description: REST adapter for Charles Schwab Market Data API — Movers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/movers/{symbol-id}
      name: movers-symbol-id
      description: REST surface for movers-symbol_id.
      operations:
      - method: GET
        name: getmovers
        description: Get top movers for an index
        call: market-data-movers.getmovers
        with:
          symbol_id: rest.symbol_id
          sort: rest.sort
          frequency: rest.frequency
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: market-data-movers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Charles Schwab Market Data API — Movers. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-top-movers-index
      description: Get top movers for an index
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: market-data-movers.getmovers
      with:
        symbol_id: tools.symbol_id
        sort: tools.sort
        frequency: tools.frequency
      outputParameters:
      - type: object
        mapping: $.
