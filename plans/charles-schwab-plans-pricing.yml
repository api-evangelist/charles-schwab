description: The Schwab Developer Portal exposes the Trader API and Market Data API to registered applications
  via OAuth 2.0. API access is free of charge for Schwab brokerage account holders building approved
  applications; revenue accrues to Schwab through the underlying brokerage relationship (commissions,
  margin, asset-based fees) rather than per-API-call pricing.
notes: Schwab does not publish per-tier API pricing. Access requires Schwab developer account approval;
  market data redistribution carries exchange license requirements. Confirm current terms via the developer
  portal.
sources:
  - https://developer.schwab.com/products/trader-api--individual
  - https://developer.schwab.com/products/market-data-api
  - https://developer.schwab.com/
plans:
  - id: charles-schwab-individual-developer
    name: Individual Developer
    type: freemium
    description: Free API access for Schwab brokerage account holders building applications for personal
      or limited distribution use. OAuth 2.0 client credentials issued via the Developer Portal.
    entries:
      - label: Trader API access
        name: trader_api
        type: subscription
        metric: account
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Market Data API access
        name: market_data_api
        type: subscription
        metric: account
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Account balances and positions
      - name: Order placement and cancellation
      - name: Real-time and historical quotes
      - name: Streaming account / market data
      - name: OAuth 2.0 authentication
  - id: charles-schwab-commercial
    name: Commercial / Redistribution
    type: enterprise
    description: Commercial use, market-data redistribution, and large-scale integrations require Schwab
      review and exchange-data agreements. No public price list.
    entries:
      - label: Commercial access
        name: commercial_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contract / exchange fees
        userMultiplied: false
    elements:
      - name: Higher-volume entitlements
      - name: Exchange market data licenses (separately fee'd)
      - name: Commercial app review by Schwab
