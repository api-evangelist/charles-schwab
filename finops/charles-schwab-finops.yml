specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Charles Schwab
providerId: charles-schwab
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Brokerage
  - Trading
description: 'FOCUS-aligned FinOps framing for Charles Schwab developer APIs: API access itself is free
  for account holders, while underlying brokerage activity (commissions, margin, asset fees) and exchange
  market-data fees produce the billing surface.'
notes: APIs are not separately priced; meters reflect brokerage and exchange-data billing lines.
sources:
  - https://developer.schwab.com/
  - https://www.schwab.com/pricing
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Charles Schwab & Co., Inc.
serviceCategory: Financial Services / Brokerage
billingModel:
  pricingCategory: Brokerage Fees + Exchange Data Pass-Through
  billingFrequency: Continuous Settlement
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Schwab Developer APIs
  ServiceCategory: Financial Services
  ProviderName: Charles Schwab
  PublisherName: Charles Schwab & Co., Inc.
  InvoiceIssuerName: Charles Schwab & Co., Inc.
  BillingCurrency: USD
meters:
  - name: equity_trades
    unit: trade
    aggregation: sum
    dimensions:
      - account
      - venue
  - name: option_contracts
    unit: contract
    aggregation: sum
    dimensions:
      - account
  - name: margin_balance
    unit: USD
    aggregation: max
  - name: asset_under_management
    unit: USD
    aggregation: avg
    dimensions:
      - product
  - name: exchange_market_data_fees
    unit: USD
    aggregation: sum
    dimensions:
      - exchange
      - feed
principles:
  - name: Visibility
    description: Use the Trader API transactions endpoints and Schwab statements to attribute fees to
      accounts, strategies, and exchanges.
  - name: Allocation
    description: Tag orders with strategy/account metadata so fees and PnL roll up to the right business
      unit.
  - name: Optimization
    description: Manage margin usage, route orders thoughtfully, and minimize redundant streaming subscriptions
      to control exchange-data fees.
  - name: Accountability
    description: Trading desk / treasury owns Schwab fees and exchange data licenses; review monthly
      against trading volume.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
