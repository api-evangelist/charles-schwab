aid: charles-schwab
name: Charles Schwab
description: Charles Schwab is a financial services company providing brokerage, banking,
  asset management, and financial advisory services to individual investors and independent
  investment advisors. The Schwab Developer Portal exposes Trader APIs that let registered
  applications access account balances, positions, and orders, place equity and option
  trades, and consume real-time and historical market data through OAuth 2.0-secured
  REST endpoints.
