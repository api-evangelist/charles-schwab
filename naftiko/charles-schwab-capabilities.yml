name: charles-schwab-capabilities
description: >-
  Naftiko sandbox capabilities for the Charles Schwab Trader and Market Data
  APIs. These capabilities let agents query brokerage account state, place
  and cancel orders, and consume real-time market data through OAuth 2.0
  authorized sessions.
provider: charles-schwab
version: '1.0'
capabilities:
  - id: schwab.accounts.list
    name: List linked accounts
    description: Retrieve all brokerage accounts linked to the authenticated Schwab user.
    operationId: listAccounts
    inputs:
      - name: fields
        type: string
        required: false
        description: Optional fields filter, e.g. positions.
    outputs:
      - name: accounts
        type: array
        description: Array of account objects with balances and positions.
    tags: [accounts, brokerage]
  - id: schwab.account.get
    name: Get account details
    description: Retrieve a specific brokerage account by encrypted account number.
    operationId: getAccount
    inputs:
      - name: accountNumber
        type: string
        required: true
    outputs:
      - name: account
        type: object
    tags: [accounts]
  - id: schwab.orders.list
    name: List orders for an account
    description: List orders for a brokerage account filtered by entered time and status.
    operationId: listOrdersByAccount
    inputs:
      - name: accountNumber
        type: string
        required: true
      - name: fromEnteredTime
        type: string
        required: false
      - name: toEnteredTime
        type: string
        required: false
      - name: status
        type: string
        required: false
    outputs:
      - name: orders
        type: array
    tags: [orders, trading]
  - id: schwab.orders.place
    name: Place an order
    description: Place a new equity or option order for a brokerage account.
    operationId: placeOrder
    inputs:
      - name: accountNumber
        type: string
        required: true
      - name: order
        type: object
        required: true
        description: Order payload conforming to the Schwab Order schema.
    outputs:
      - name: orderId
        type: string
    tags: [orders, trading]
  - id: schwab.orders.cancel
    name: Cancel an order
    description: Cancel an open order on a Schwab brokerage account.
    operationId: cancelOrder
    inputs:
      - name: accountNumber
        type: string
        required: true
      - name: orderId
        type: string
        required: true
    outputs: []
    tags: [orders, trading]
  - id: schwab.market.quotes
    name: Get quotes
    description: Retrieve real-time or delayed quotes for one or more symbols.
    operationId: getQuotes
    inputs:
      - name: symbols
        type: string
        required: true
    outputs:
      - name: quotes
        type: object
    tags: [market-data, quotes]
  - id: schwab.market.priceHistory
    name: Get price history
    description: Retrieve historical price candles for a symbol.
    operationId: getPriceHistory
    inputs:
      - name: symbol
        type: string
        required: true
      - name: periodType
        type: string
        required: false
      - name: frequencyType
        type: string
        required: false
    outputs:
      - name: candles
        type: array
    tags: [market-data, price-history]
  - id: schwab.market.optionChain
    name: Get option chain
    description: Retrieve the option chain for a given underlying symbol.
    operationId: getOptionChains
    inputs:
      - name: symbol
        type: string
        required: true
      - name: contractType
        type: string
        required: false
    outputs:
      - name: optionChain
        type: object
    tags: [market-data, options]
